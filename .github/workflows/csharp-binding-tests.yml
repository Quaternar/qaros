name: C# binding tests

# Runs the Quaternar.Qaros tests against a published QAROS C API runtime: the
# QAROS-CApi-<version>-RelWithDebInfo.zip asset of a Quaternar/Quaternar release (signed qar-streaming-c,
# qar-streaming-c-ext and the GPU-memory transfer with every DLL they load, headers, PDBs).
#
# Needs a self-hosted Windows runner registered for this repository (or the organization): the tests
# drive Direct3D 11 and Vulkan, which hosted runners do not offer. Repository variable QAROS_TEST_RUNNER
# (JSON label list) picks it; the default is ["self-hosted", "Windows", "X64"].
# Secret QAR_RELEASES_TOKEN: a token that can read Quaternar/Quaternar releases (contents: read).

on:
  workflow_dispatch:
    inputs:
      release:
        description: Quaternar release to test against (a vX.Y.Z tag, or dev-<branch> for a branch build)
        required: true
        default: dev-feature-qaros-local-enrollment
  pull_request:
    paths:
      - "qar-streaming-sharp/**"
      - "qar-streaming-c/include/**"
      - ".github/workflows/csharp-binding-tests.yml"
      - "ci/csharp-binding-tests.ps1"
      - "ci/common.ps1"

permissions:
  contents: read

concurrency:
  group: csharp-binding-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # A pull request tests against the moving release of the branch the C API is developed on.
  QAROS_RUNTIME_RELEASE: ${{ inputs.release || vars.QAROS_DEFAULT_RUNTIME_RELEASE || 'dev-feature-qaros-local-enrollment' }}
  RUNTIME_DIR: ${{ github.workspace }}\qaros-capi-runtime

jobs:
  test:
    runs-on: ${{ fromJSON(vars.QAROS_TEST_RUNNER || '["self-hosted", "Windows", "X64"]') }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Downloads the release's C API runtime and runs the tests against it; run the script locally
      # the same way, or with QAROS_NATIVE_BIN set to a native folder of your own.
      - name: Download the C API runtime and test
        env:
          GH_TOKEN: ${{ secrets.QAR_RELEASES_TOKEN }}
        run: |
          ./ci/csharp-binding-tests.ps1 -Release $env:QAROS_RUNTIME_RELEASE -RuntimeDirectory $env:RUNTIME_DIR `
            -ResultsDirectory "$env:RUNNER_TEMP\test-results"

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-binding-test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
