name: C# binding tests

# Runs the Quaternar.Qaros tests against a published QAROS C API runtime: the
# QAROS-CApi-<version>-RelWithDebInfo.zip asset of a Quaternar/Quaternar release (signed qar-streaming-c,
# qar-streaming-c-ext and the GPU-memory transfer with every DLL they load, headers, PDBs).
#
# Needs a self-hosted Windows runner registered for this repository (or the organization): the tests
# drive Direct3D 11 and Vulkan, which hosted runners do not offer. Repository variable QAROS_TEST_RUNNER
# (JSON label list) picks it; the default is ["self-hosted", "Windows", "X64"].
# Secret QAR_RELEASES_TOKEN: a token that can read Quaternar/Quaternar releases (contents: read).

on:
  workflow_dispatch:
    inputs:
      release:
        description: Quaternar release to test against (a vX.Y.Z tag, or dev-<branch> for a branch build)
        required: true
        default: dev-feature-qaros-local-enrollment
  pull_request:
    paths:
      - "qar-streaming-sharp/**"
      - "qar-streaming-c/include/**"
      - ".github/workflows/csharp-binding-tests.yml"

permissions:
  contents: read

concurrency:
  group: csharp-binding-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # A pull request tests against the moving release of the branch the C API is developed on.
  QAROS_RUNTIME_RELEASE: ${{ inputs.release || vars.QAROS_DEFAULT_RUNTIME_RELEASE || 'dev-feature-qaros-local-enrollment' }}
  RUNTIME_DIR: ${{ github.workspace }}\qaros-capi-runtime

jobs:
  test:
    runs-on: ${{ fromJSON(vars.QAROS_TEST_RUNNER || '["self-hosted", "Windows", "X64"]') }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download the C API runtime
        env:
          GH_TOKEN: ${{ secrets.QAR_RELEASES_TOKEN }}
        run: |
          if (Test-Path $env:RUNTIME_DIR) { Remove-Item -LiteralPath $env:RUNTIME_DIR -Recurse -Force }
          New-Item -ItemType Directory -Path $env:RUNTIME_DIR | Out-Null
          gh release download $env:QAROS_RUNTIME_RELEASE --repo Quaternar/Quaternar `
            --pattern 'QAROS-CApi-*-RelWithDebInfo.zip' --dir $env:RUNTIME_DIR
          $zip = Get-ChildItem $env:RUNTIME_DIR -Filter 'QAROS-CApi-*-RelWithDebInfo.zip' | Select-Object -First 1
          if (-not $zip) { throw "No QAROS-CApi ZIP in release $env:QAROS_RUNTIME_RELEASE" }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $env:RUNTIME_DIR
          # The ZIP holds one folder named after itself.
          $bin = Join-Path $env:RUNTIME_DIR (Join-Path $zip.BaseName 'bin')
          if (-not (Test-Path (Join-Path $bin 'qar-streaming-c.dll'))) { throw "qar-streaming-c.dll missing in $bin" }
          "QAROS_NATIVE_BIN=$bin" >> $env:GITHUB_ENV
          Write-Host "Testing against $($zip.Name)"

      - name: Test
        working-directory: qar-streaming-sharp
        run: |
          dotnet test tests/QarStreaming.Tests/QarStreaming.Tests.csproj -c Release -f net8.0 `
            "-p:QarStreamingNativeBinDir=$env:QAROS_NATIVE_BIN" `
            --logger "trx;LogFileName=csharp-binding-tests.trx" --results-directory "$env:RUNNER_TEMP\test-results"

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csharp-binding-test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
