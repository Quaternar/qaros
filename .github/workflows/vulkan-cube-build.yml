name: Vulkan cube build

# Builds the Vulkan cube source app exactly as Developer Guide > Getting Started tells a new user:
# a hosted Windows runner with Visual Studio and no Vulkan SDK, the two documented commands from a
# developer shell. Proves the public repository alone builds the cube (vcpkg brings the Vulkan
# headers, loader and glslc). Build only: running the cube needs an installed QAROS and a GPU.

on:
  pull_request:
    paths:
      - "qar-streaming-c/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/vulkan-cube-build.yml"
  push:
    branches: [main]
    paths:
      - "qar-streaming-c/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/vulkan-cube-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-cube-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: No Vulkan SDK on the runner
        run: |
          if ($env:VULKAN_SDK) { throw "VULKAN_SDK is set ($env:VULKAN_SDK): the build would not prove the documented setup." }
          if (Get-Command glslc -ErrorAction SilentlyContinue) { throw "glslc is on PATH: the build would not prove the documented setup." }

      # Developer PowerShell for VS 2022, as the page says: Visual Studio's own CMake and Ninja.
      - name: Configure and build (as documented)
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          if (-not $vs) { throw 'No Visual Studio on the runner.' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake --preset x64-windows -DBUILD_VULKAN_EXAMPLE=ON -DVCPKG_MANIFEST_FEATURES=examples-vulkan
          if ($LASTEXITCODE -ne 0) { throw "configure failed ($LASTEXITCODE)" }
          cmake --build --preset x64-windows-release --target qar-vulkan-source
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }

      - name: The documented output exists
        run: |
          $exe = 'build\x64-windows\qar-streaming-c\examples\vulkan_cube\Release\qar-vulkan-source.exe'
          if (-not (Test-Path $exe)) { throw "$exe missing" }
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "qar-vulkan-source --help exited $LASTEXITCODE" }
