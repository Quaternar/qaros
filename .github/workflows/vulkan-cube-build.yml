name: Vulkan cube build

# Builds the Vulkan cube source app exactly as Developer Guide > Getting Started tells a new user:
# a hosted Windows runner with Visual Studio and no Vulkan SDK, the two documented commands from a
# developer shell. Proves the public repository alone builds the cube (vcpkg brings the Vulkan
# headers, loader and glslc). Build only: running the cube needs an installed QAROS and a GPU.

on:
  pull_request:
    paths:
      - "qar-streaming-c/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/vulkan-cube-build.yml"
      - "ci/vulkan-cube-build.ps1"
      - "ci/common.ps1"
  push:
    branches: [main]
    paths:
      - "qar-streaming-c/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/vulkan-cube-build.yml"
      - "ci/vulkan-cube-build.ps1"
      - "ci/common.ps1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-cube-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ci/vulkan-cube-build.ps1: no Vulkan SDK on the runner (-Strict), the documented configure and
      # build from Developer PowerShell for VS 2022 (Visual Studio's own CMake and Ninja), then the
      # documented output exists and runs. Run it locally the same way; without -Strict it hides a
      # local Vulkan SDK from the build instead of failing.
      - name: Configure and build (as documented)
        run: ./ci/vulkan-cube-build.ps1 -Strict
