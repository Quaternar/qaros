name: Vulkan cube build

# Builds the Vulkan cube source app exactly as Developer Guide > Getting Started tells a new user:
# a hosted Windows runner with Visual Studio and no Vulkan SDK, the two documented commands from a
# developer shell. Proves the public repository alone builds the cube (vcpkg brings the Vulkan
# headers, loader and glslc). Build only: running the cube needs an installed QAROS and a GPU.
# The checks and the build are `python ci/run.py vulkan-cube`; run it locally the same way
# (without --strict it hides a local Vulkan SDK from the build instead of failing).

on:
  pull_request:
    paths:
      - "qar-streaming-c/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/vulkan-cube-build.yml"
      - "ci/**"
  push:
    branches: [main]
    paths:
      - "qar-streaming-c/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - ".github/workflows/vulkan-cube-build.yml"
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-cube-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No Vulkan SDK on the runner (--strict), the documented configure and build in Visual
      # Studio's developer environment (its own CMake and Ninja, from vcvars64.bat), then the
      # documented output exists and runs.
      - name: Configure and build (as documented)
        run: python ci/run.py vulkan-cube --strict
