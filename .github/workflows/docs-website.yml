name: Docs Website

on:
  push:
    branches: [main]
    paths:
      - "docs/website/**"
      - "qar-streaming-c/include/**"
      - "qar-streaming-c/examples/**"
      - "qar-streaming-sharp/src/**"
      - "qar-streaming-sharp/Quaternar.Qaros.csproj"
      - ".github/workflows/docs-website.yml"
  pull_request:
    paths:
      - "docs/website/**"
      - "qar-streaming-c/include/**"
      - "qar-streaming-c/examples/**"
      - "qar-streaming-sharp/src/**"
      - "qar-streaming-sharp/Quaternar.Qaros.csproj"
      - ".github/workflows/docs-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/website/package-lock.json

      # C# API reference: DocFX (pinned in docs/website/dotnet-tools.json) reads
      # qar-streaming-sharp through Roslyn, so only the SDK is needed.
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen cmake

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          preview: ${{ github.event_name == 'pull_request' }}
