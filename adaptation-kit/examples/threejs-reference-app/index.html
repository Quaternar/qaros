<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Aurora Model Viewer</title>
		<link rel="stylesheet" href="./src/style.css" />
	</head>
	<body>
		<!--
			This is a self-contained demo application: an ordinary three.js model viewer with its own
			chrome (side panels, notifications, a dialog, and a canvas overlay). It has no knowledge of
			QAR, streaming, or multi-user rendering -- it is meant to stand in for a real customer
			application nobody has integrated with QAR, so an adaptation script has to take it over from
			the outside rather than being handed cooperation from the inside.

			Everything a user would ever see -- panels, toasts, the dialog, the HUD -- lives inside
			#app-ui, a single container. That is deliberate scaffolding for the *adaptation*, not for the
			app: an adaptation script confines exactly one element to the reserved page region, and
			keeping every piece of chrome under one root is what makes that a one-line CSS change instead
			of hunting down every fixed-position element in the document.
		-->
		<canvas id="viewport"></canvas>

		<div id="app-ui">
			<aside id="panel-left" class="panel">
				<h2>Examples</h2>
				<nav id="example-list" aria-label="Examples">
					<button type="button" data-example="gallery">Geometry gallery</button>
					<button type="button" data-example="gltf-avif">glTF AVIF example</button>
				</nav>
				<h2>Scene Objects</h2>
				<ul id="object-list"></ul>
			</aside>

			<aside id="panel-right" class="panel">
				<h2>Settings</h2>
				<label class="field">
					<span>Rotation speed</span>
					<input id="rotation-speed" type="range" min="0" max="100" value="35" />
				</label>
				<label class="field">
					<span>Light intensity</span>
					<input id="light-intensity" type="range" min="0" max="100" value="70" />
				</label>
				<button id="open-about" type="button">About this viewer</button>
			</aside>

			<div id="hud">
				<div id="reticle"></div>
				<div id="hud-readout">FPS <span id="hud-fps">--</span></div>
			</div>

			<div id="toast-stack"></div>

			<div id="modal-backdrop" class="hidden">
				<div id="modal" role="dialog" aria-labelledby="modal-title">
					<h2 id="modal-title">Welcome to Aurora Model Viewer</h2>
					<p>
						Drag objects in the scene list to inspect them, or tweak the settings on the right.
						This preview build renders continuously in the background.
					</p>
					<button id="modal-close" type="button">Got it</button>
				</div>
			</div>
		</div>

		<script type="module" src="./src/main.js"></script>
	</body>
</html>
