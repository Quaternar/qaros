<!doctype html>
<!--
	Fixture of KitLibraries.ThreejsWebGlAntialiasSmoothsThinLinesAndKeepsEdgeDepth: a WebGLRenderer
	scene seen by the test's user camera (at (0, 1, 1.2) looking down -Z, 90 degree field of view,
	128x128 eye texels).
	- Top half of the eye: four lines thinner than an eye texel (quads half a texel wide at two metres),
	  white on the black clear colour, the way three.js LineMaterial draws a grid of sub-pixel width.
	  Single-sampled they break up into dots; multisampled they stay continuous and antialiased.
	- Bottom half: a red square two metres away, tilted, in front of a blue plane three metres away.
	  Both face the camera, so each has one depth: an edge texel must carry one of the two, never a
	  value between.
	The test replaces __THREE_IMPORT_MAP__ with an import map of data: URLs of a three.js build.
-->
<html>
<body style="margin:0;overflow:hidden;background:#000">
<canvas id="c" style="display:block"></canvas>
<script>
window.__fixtureErrors = [];
window.addEventListener("error", (event) => window.__fixtureErrors.push(String(event.message)));
window.addEventListener("unhandledrejection", (event) => window.__fixtureErrors.push(String(event.reason)));
</script>
<script type="importmap">__THREE_IMPORT_MAP__</script>
<script type="module">
const THREE = await import("three");

async function start() {
	// The adaptation's devtools hook must exist first, so three.js announces the renderer to it.
	while (!window.__THREE_DEVTOOLS__) await new Promise((resolve) => setTimeout(resolve, 20));
	const canvas = document.getElementById("c");
	const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
	renderer.setPixelRatio(1);
	renderer.setClearColor(0x000000, 1);
	renderer.setSize(window.innerWidth, window.innerHeight);
	window.addEventListener("resize", () => renderer.setSize(window.innerWidth, window.innerHeight));
	const scene = new THREE.Scene();
	const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 20);
	camera.position.set(0, 1, 3);

	// One eye texel at two metres: 4 m of view height over 128 texels.
	const texelAtTwoMetres = 4 / 128;
	const white = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
	[5, 30, 60, 85].forEach((angle, index) => {
		const line = new THREE.Mesh(new THREE.PlaneGeometry(1.1, texelAtTwoMetres * 0.5), white);
		line.position.set(-1.35 + index * 0.9, 2.0, -0.8);
		line.rotation.z = (angle * Math.PI) / 180;
		scene.add(line);
	});

	const back = new THREE.Mesh(new THREE.PlaneGeometry(5, 2.6), new THREE.MeshBasicMaterial({ color: 0x0000ff }));
	back.position.set(0, -0.35, -1.8);
	const front = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
	front.position.set(0, 0.25, -0.8);
	front.rotation.z = 0.3;
	scene.add(back, front);

	renderer.setAnimationLoop(() => renderer.render(scene, camera));
	window.__fixtureReady = true;
}
start().catch((error) => window.__fixtureErrors.push(String((error && error.stack) || error)));
</script>
</body>
</html>
