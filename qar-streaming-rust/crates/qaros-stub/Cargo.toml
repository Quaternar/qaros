[package]
name = "qaros-stub"
description = "In-memory stand-in for qar-streaming-c that exports the qar_impl_* symbols, for testing the runtime-loading path, error mapping and teardown order without Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib is what tests and examples load; rlib lets `qaros` name this crate as
# a dev-dependency so that `cargo test` builds the cdylib first.
crate-type = ["cdylib", "rlib"]

[dependencies]
qaros-sys.workspace = true
ash.workspace = true
libloading.workspace = true

[lints]
workspace = true
