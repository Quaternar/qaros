[workspace]
resolver = "3"
members = [
    "crates/qaros-sys",
    "crates/qaros",
    "xtask",
]
default-members = [
    "crates/qaros-sys",
    "crates/qaros",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Quaternar/qaros"
homepage = "https://docs.quaternar.com"
publish = false

[workspace.dependencies]
qaros-sys = { path = "crates/qaros-sys" }
qaros = { path = "crates/qaros" }
libloading = "0.8"
log = "0.4"
# 0.38 is the version wgpu-hal 30 uses, so handles pass between them as is.
ash = { version = "0.38", default-features = false, features = ["std", "debug"] }
# Windows only: the D3D11 types of qaros's `d3d11` feature and the D3D11 example.
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
